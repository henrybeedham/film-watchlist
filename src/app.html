<!doctype html>
<html lang="en-GB" data-theme="%app.theme%" data-mode="%app.mode%" class="%app.class%">
	<head>
		<meta charset="utf-8" />
		<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
		<meta name="text-scale" content="scale" />
		<meta name="theme-color" content="#1c1714" />
		<meta name="apple-mobile-web-app-capable" content="yes" />
		<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
		<meta name="apple-mobile-web-app-title" content="Watchlist" />
		<link rel="manifest" href="/manifest.webmanifest" />
		<link rel="icon" href="/favicon.svg" type="image/svg+xml" />
		<link rel="apple-touch-icon" href="/icons/apple-touch-icon.png" />
		<script nonce="%sveltekit.nonce%">
			// "Match device": follow the system setting, live.
			(function () {
				var root = document.documentElement;
				if (root.dataset.mode !== 'system') return;
				var q = matchMedia('(prefers-color-scheme: dark)');
				var apply = function () {
					root.classList.toggle('dark', q.matches);
				};
				apply();
				q.addEventListener('change', apply);
			})();
		</script>
		%sveltekit.head%
	</head>
	<body data-sveltekit-preload-data="hover">
		<div style="display: contents">%sveltekit.body%</div>
	</body>
</html>
